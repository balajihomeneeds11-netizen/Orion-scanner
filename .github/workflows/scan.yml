name: Run Morning Orion Scan

on:
  schedule:
    # 03:46 UTC = 9:16 AM IST (Monday to Friday)
    - cron: '46 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libs
        run: pip install yfinance pandas numpy

      - name: Run 7-Pillars Scanner
        run: python scanner.py

      - name: Commit and Push
        run: |
          git config --global user.name "Actions Bot"
          git config --global user.email "bot@github.com"
          git add data.json
          git commit -m "Auto-update 7-pillar cards [skip ci]" || exit 0
          git push
