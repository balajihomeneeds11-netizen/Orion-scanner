name: Auto Orion Scanner

on:
  schedule:
    # 1. The Opening Bell Scan: Runs exactly at 9:16 AM IST (03:46 UTC)
    - cron: '46 3 * * 1-5'
    # 2. The Sustained Scan: Runs every 5 minutes from 9:30 AM to 3:25 PM IST (04:00 to 09:59 UTC)
    - cron: '*/5 4-9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libs
        run: pip install yfinance pandas numpy

      - name: Run 7-Pillars Scanner & Dispatch Alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Commit and Push
        run: |
          git config --global user.name "Actions Bot"
          git config --global user.email "bot@github.com"
          git add data.json
          git commit -m "Auto-update 7-pillar cards & alerts [skip ci]" || exit 0
          git push
