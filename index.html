<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORION 7-PILLARS TERMINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f17; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .tab-active { background-color: #1e293b; border-bottom: 2px solid #38bdf8; }
        .glowing-led { box-shadow: 0 0 8px #34d399; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body class="p-3 md:p-6 max-w-6xl mx-auto">

    <!-- Top Header -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center pb-4 border-b border-gray-800 gap-3">
        <div>
            <div class="flex items-center gap-3">
                <h1 class="text-xl md:text-2xl font-bold tracking-tight text-white">ORION 7-PILLARS TERMINAL</h1>
                <span class="px-2.5 py-0.5 bg-emerald-950 text-emerald-300 rounded-full border border-emerald-600 flex items-center gap-1.5 text-xs font-semibold">
                    <div class="w-2 h-2 bg-emerald-400 rounded-full glowing-led"></div>
                    PIPELINE ACTIVE
                </span>
            </div>
            <p class="text-xs text-gray-400 mt-1">Full NSE F&O Universe • 7-Rule Intraday Options Breakout Engine</p>
        </div>
        <div id="sync-time" class="text-xs text-gray-400 font-mono">Syncing...</div>
    </header>

    <!-- Breadth Bar -->
    <section class="grid grid-cols-3 gap-2 my-4 bg-gray-900 border border-gray-800 p-2.5 rounded-lg text-center text-xs md:text-sm">
        <div>Advances: <span id="adv-count" class="font-bold text-emerald-400">0</span></div>
        <div>Declines: <span id="dec-count" class="font-bold text-rose-400">0</span></div>
        <div>Sentiment: <span id="sentiment" class="font-bold text-sky-400">NEUTRAL</span></div>
    </section>

    <!-- Navigation Filter Tabs -->
    <nav class="flex gap-1.5 my-3 overflow-x-auto pb-1 text-xs">
        <button onclick="filterCards('ALL')" class="px-3 py-1.5 rounded bg-gray-800 font-semibold hover:bg-gray-700">ALL</button>
        <button onclick="filterCards('BRAHMASTRA')" class="px-3 py-1.5 rounded bg-sky-950 text-sky-300 border border-sky-700 font-semibold">⚡ BRAHMASTRA</button>
        <button onclick="filterCards('EXPLOSIVE')" class="px-3 py-1.5 rounded bg-rose-950 text-rose-300 border border-rose-700 font-semibold">💥 EXPLOSIVE</button>
        <button onclick="filterCards('STRONG')" class="px-3 py-1.5 rounded bg-amber-950 text-amber-300 border border-amber-700 font-semibold">🔥 STRONG</button>
        <button onclick="filterCards('SPURT')" class="px-3 py-1.5 rounded bg-yellow-950 text-yellow-300 border border-yellow-700 font-semibold">⚡ SPURT</button>
        <button onclick="filterCards('SHORT ZONE')" class="px-3 py-1.5 rounded bg-red-950 text-red-400 border border-red-800 font-semibold">⚠️ SHORT ZONE</button>
    </nav>

    <!-- Cards Stream Grid -->
    <main id="cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4"></main>

    <script>
        let allSetups = [];

        async function loadData() {
            try {
                const res = await fetch('data.json?t=' + new Date().getTime());
                const data = await res.json();
                
                document.getElementById('sync-time').innerText = 'Last Sync: ' + data.lastUpdated + ' IST';
                document.getElementById('adv-count').innerText = data.breadth.advances;
                document.getElementById('dec-count').innerText = data.breadth.declines;
                document.getElementById('sentiment').innerText = data.breadth.sentiment;

                allSetups = data.leaders || [];
                renderCards(allSetups);
            } catch (err) {
                console.error("Failed to load data.json", err);
            }
        }

        function renderCards(cards) {
            const container = document.getElementById('cards-container');
            if (!cards.length) {
                container.innerHTML = `<div class="col-span-full py-12 text-center text-gray-500 text-sm">No active setups matching filter criteria right now.</div>`;
                return;
            }

            container.innerHTML = cards.map(c => {
                const isPE = c.type === "PE";
                const badgeColor = c.tier === 'BRAHMASTRA' ? 'bg-sky-600 text-white' :
                                   c.tier === 'EXPLOSIVE' ? 'bg-rose-600 text-white' :
                                   c.tier === 'STRONG' ? 'bg-amber-600 text-white' :
                                   c.tier === 'SHORT ZONE' ? 'bg-red-700 text-white' : 'bg-yellow-600 text-white';
                
                const cardBorder = isPE ? 'border-red-900/60 bg-[#160d10]' : 'border-gray-800 bg-[#111622]';

                return `
                <div class="border ${cardBorder} rounded-lg p-3.5 relative flex flex-col justify-between shadow-sm">
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex items-center gap-2">
                            <span class="text-xs px-2 py-0.5 rounded font-bold ${isPE ? 'bg-rose-900 text-rose-200' : 'bg-emerald-900 text-emerald-200'}">${c.type}</span>
                            <span class="text-xs px-2 py-0.5 rounded font-bold ${badgeColor}">${c.tier}</span>
                            <span class="text-xs text-gray-400 font-mono">🏆 ${c.score}</span>
                        </div>
                        <span class="text-xs font-mono text-gray-400">🕒 ${c.detectTime}</span>
                    </div>

                    <div class="flex justify-between items-baseline mb-2">
                        <h2 class="text-lg font-bold text-white tracking-wide">${c.symbol}</h2>
                        <div class="text-right">
                            <span class="font-bold text-white text-base">₹${c.price}</span>
                            <span class="text-xs font-semibold ml-1 ${c.pctChange.startsWith('+') ? 'text-emerald-400' : 'text-rose-400'}">${c.pctChange}</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-x-2 gap-y-1 text-xs text-gray-400 bg-black/30 p-2 rounded mb-3 font-mono">
                        <div>Vol Surge: <b class="text-white">${c.volumeX}</b></div>
                        <div>RSI (14): <b class="text-white">${c.rsi}</b></div>
                        <div>Target 1: <b class="text-emerald-400">₹${c.t1}</b></div>
                        <div>Stop Loss: <b class="text-rose-400">₹${c.sl}</b></div>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-gray-800 text-xs">
                        <div>
                            <span class="text-gray-400">Strike Zone:</span> 
                            <span class="font-bold text-sky-400">${c.strike}</span> 
                            <span class="text-gray-500 font-mono">(@ ${c.premium})</span>
                        </div>
                        <div class="flex gap-1.5">
                            <a href="https://in.tradingview.com/chart/?symbol=NSE:${c.symbol}" target="_blank" class="px-2 py-1 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded text-[11px]">Chart</a>
                            <a href="https://kite.zerodha.com" target="_blank" class="px-2 py-1 bg-amber-950 hover:bg-amber-900 text-amber-200 rounded text-[11px]">Zerodha</a>
                            <a href="https://upstox.com" target="_blank" class="px-2 py-1 bg-purple-950 hover:bg-purple-900 text-purple-200 rounded text-[11px]">Upstox</a>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function filterCards(tier) {
            if (tier === 'ALL') {
                renderCards(allSetups);
            } else {
                renderCards(allSetups.filter(c => c.tier === tier));
            }
        }

        loadData();
        setInterval(loadData, 30000);
    </script>
</body>
</html>
