<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORION Breakout Scanner — 7 Pillars Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0d1117; color: #c9d1d9; font-family: ui-sans-serif, system-ui, sans-serif; }
    .card-explosive { border-left: 4px solid #ef4444; background: #161b22; }
    .card-strong { border-left: 4px solid #f97316; background: #161b22; }
    .card-spurt { border-left: 4px solid #eab308; background: #161b22; }
    .badge-ce { background: #064e3b; color: #34d399; }
    .badge-pe { background: #7f1d1d; color: #f87171; }
  </style>
</head>
<body class="p-4 md:p-8">

  <!-- Header -->
  <header class="flex flex-col md:flex-row justify-between items-start md:items-center pb-6 border-b border-gray-800 gap-4">
    <div>
      <div class="flex items-center gap-3">
        <h1 class="text-2xl font-bold tracking-tight text-white">ORION 7-PILLARS TERMINAL</h1>
        <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-emerald-950 text-emerald-400 border border-emerald-800">
          ● LIVE 9:16 AM FEED
        </span>
      </div>
      <p class="text-sm text-gray-400">Complete 7-Rule Intraday F&O Breakout System</p>
    </div>

    <!-- Market Mood Breadth Bar -->
    <div class="bg-gray-900 border border-gray-800 rounded-lg p-3 text-xs flex gap-6">
      <div>Advances: <span id="adv-count" class="text-emerald-400 font-bold">--</span></div>
      <div>Declines: <span id="dec-count" class="text-rose-400 font-bold">--</span></div>
      <div>Sentiment: <span id="sentiment" class="text-emerald-400 font-bold">MONITORING</span></div>
    </div>
  </header>

  <!-- Filter Navigation Tabs -->
  <div class="flex gap-2 my-6 overflow-x-auto">
    <button onclick="filterCards('ALL')" class="px-3 py-1.5 rounded text-xs font-medium bg-gray-800 text-white hover:bg-gray-700">ALL</button>
    <button onclick="filterCards('EXPLOSIVE')" class="px-3 py-1.5 rounded text-xs font-medium bg-red-950 text-red-400 border border-red-800">💥 EXPLOSIVE (6-7 Pillars)</button>
    <button onclick="filterCards('STRONG')" class="px-3 py-1.5 rounded text-xs font-medium bg-orange-950 text-orange-400 border border-orange-800">🔥 STRONG (5 Pillars)</button>
    <button onclick="filterCards('SPURT')" class="px-3 py-1.5 rounded text-xs font-medium bg-yellow-950 text-yellow-400 border border-yellow-800">⚡ SPURT (4 Pillars)</button>
  </div>

  <!-- Cards Grid -->
  <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <!-- Dynamic Cards Injected Here -->
  </div>

  <script>
    async function fetchScannerData() {
      try {
        const res = await fetch('data.json?t=' + new Date().getTime());
        const data = await res.json();

        if (data.breadth) {
          document.getElementById("adv-count").innerText = data.breadth.advances;
          document.getElementById("dec-count").innerText = data.breadth.declines;
          if (data.breadth.sentiment) {
            document.getElementById("sentiment").innerText = data.breadth.sentiment;
          }
        }

        window.allLeaders = data.leaders || [];
        renderCards(window.allLeaders);
      } catch (e) {
        console.log("Awaiting scan updates...", e);
      }
    }

    function renderCards(data) {
      const container = document.getElementById("cards-container");
      container.innerHTML = "";

      if (!data || data.length === 0) {
        container.innerHTML = `<div class="text-gray-500 text-sm p-4 col-span-3">Scanning market for 7-pillar setups...</div>`;
        return;
      }

      data.forEach(item => {
        const cardClass = item.tier === 'EXPLOSIVE' ? 'card-explosive' : (item.tier === 'STRONG' ? 'card-strong' : 'card-spurt');
        const badgeClass = item.type === 'CE' ? 'badge-ce' : 'badge-pe';

        const card = document.createElement("div");
        card.className = `${cardClass} p-4 rounded-lg shadow-lg border border-gray-800 transition hover:border-gray-700`;
        card.innerHTML = `
          <div class="flex justify-between items-center mb-2">
            <div class="flex items-center gap-2">
              <span class="text-xs font-semibold px-2 py-0.5 rounded ${badgeClass}">${item.type}</span>
              <span class="text-xs font-bold px-1.5 py-0.5 rounded bg-blue-950 text-blue-300 border border-blue-800">🏆 ${item.score || '7/7'}</span>
            </div>
            <span class="text-xs text-gray-400">🕐 ${item.detectTime}</span>
          </div>

          <div class="flex justify-between items-baseline mb-2">
            <h2 class="text-xl font-bold text-white tracking-wide">${item.symbol}</h2>
            <div class="text-right">
              <span class="text-sm font-semibold text-white">₹${item.price}</span>
              <span class="text-xs ml-1 ${item.type === 'CE' ? 'text-emerald-400' : 'text-rose-400'} font-bold">${item.pctChange}</span>
            </div>
          </div>

          <!-- 7-Pillars Matrix -->
          <div class="grid grid-cols-2 gap-2 text-xs bg-gray-900/60 p-2.5 rounded border border-gray-800/80 mb-3">
            <div>1. Universe: <span class="text-emerald-400 font-bold">F&O</span></div>
            <div>2. Vol Surge: <span class="text-amber-400 font-bold">${item.volumeX}</span></div>
            <div>3. ORB High: <span class="text-emerald-400 font-bold">BROKEN</span></div>
            <div>4. VWAP: <span class="text-emerald-400 font-bold">ABOVE</span></div>
            <div>5. PDH Break: <span class="text-emerald-400 font-bold">YES</span></div>
            <div>6. Follow-Thru: <span class="text-emerald-400 font-bold">CONFIRMED</span></div>
            <div>7. RSI (>60): <span class="text-gray-200 font-bold">${item.rsi}</span></div>
            <div>Risk Rule: <span class="text-purple-400 font-bold">1% SL LAW</span></div>
          </div>

          <!-- Actionable Strike & Targets -->
          <div class="border-t border-gray-800 pt-3 flex justify-between items-center text-xs">
            <div>
              <p class="text-gray-400">Pillar 7 Strike Zone</p>
              <p class="font-bold text-white text-sm">${item.strike} <span class="text-gray-400 font-normal">(@ ${item.premium})</span></p>
            </div>
            <div class="text-right">
              <p class="text-gray-400">SL: <span class="text-rose-400 font-semibold">${item.sl}</span></p>
              <p class="text-gray-400">T1: <span class="text-emerald-400 font-semibold">${item.t1}</span></p>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterCards(tier) {
      if (!window.allLeaders) return;
      if (tier === 'ALL') {
        renderCards(window.allLeaders);
      } else {
        renderCards(window.allLeaders.filter(d => d.tier === tier));
      }
    }

    fetchScannerData();
    setInterval(fetchScannerData, 10000);
  </script>
</body>
</html>
